<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arayana Sood — 3rd-Year B.Tech Student with a minor in Data Science at Lovely Professional University. Turning ideas and data into practical software." />
    <meta name="theme-color" content="#1B1917" />

    <!-- Google Fonts for Editorial Typography (Newsreader & Instrument Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arayana Sood — Portfolio" />
    <meta property="og:description" content="3rd-Year B.Tech Student · Data Science Minor · Machine Learning & Software Engineering" />
    <meta property="og:image" content="/og-image.png" />

    <title>Arayana Sood — Portfolio | Data Science & Engineering</title>

    <!--
      Inline theme script — runs before any CSS or JS loads.
      Prevents the flash of incorrect theme (FOIT) on page load.
      Reads localStorage preference → falls back to system preference.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('arayana-theme');
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
